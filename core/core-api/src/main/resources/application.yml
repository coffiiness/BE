spring.application.name: core-api
spring.profiles.active: local

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:true}
    sender: ${APP_EMAIL_SENDER:${SPRING_MAIL_USERNAME:no-reply@calfit.com}}
    api-base-url: ${APP_EMAIL_API_BASE_URL:http://localhost:8080}
    frontend-base-url: ${APP_EMAIL_FRONTEND_BASE_URL:http://localhost:5173}

aws:
  region: ap-northeast-2

s3:
  applicant-bucket: calfit-applicant   # 실제 버킷명
  key-prefix: uploads
  presign-expire-minutes: 10

spring:
  config:
    import:
      - monitoring.yml
      - logging.yml
      - db-core.yml
      - optional:google-calendar.yml
  web.resources.add-mappings: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.ssl.enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:false}
      mail.smtp.connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
      mail.smtp.writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000   # 1시간 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

# 토스페이먼츠 설정
toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY:test_default}
    secret-key: ${TOSS_SECRET_KEY:test_default}
    api-base-url: https://api.tosspayments.com

server:
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

---
spring.config.activate.on-profile: local

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000

---
spring.config.activate.on-profile: dev

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:5011
    - http://beyond21.iptime.org:5011

---
spring.config.activate.on-profile: prod

cors:
  allowed-origins:
    - https://calfit.co.kr
    - https://www.calfit.co.kr




import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java-library'
    id 'org.springframework.boot' apply(false)
    id 'io.spring.dependency-management'
    id 'com.diffplug.spotless' apply(false)
    id 'org.asciidoctor.jvm.convert' apply(false)
    id 'com.github.spotbugs' version "${spotbugsPluginVersion}" apply(false)
    id 'jacoco'
}

apply from: 'lint.gradle'

allprojects {
    group = "${projectGroup}"
    version = "${applicationVersion}"
    sourceCompatibility = project.javaVersion

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.asciidoctor.jvm.convert'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "${jacocoVersion}"
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudDependenciesVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    bootJar.enabled = false
    jar.enabled = true

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform {
            excludeTags('develop', 'restdocs')
        }
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                limit {
                    minimum = 0.10
                }
            }
        }
    }

    check.dependsOn jacocoTestCoverageVerification

    tasks.register('restDocsTest', Test) {
        group = 'verification'
        useJUnitPlatform {
            includeTags('restdocs')
        }
    }

    tasks.register('developTest', Test) {
        group = 'verification'
        useJUnitPlatform {
            includeTags('develop')
        }
    }

    tasks.named('asciidoctor') {
        dependsOn restDocsTest
    }
}

subprojects {
    // Use the analyzer's reporting mode and enforce the reviewed policy separately.
    apply plugin: 'com.github.spotbugs-base'
    // Spring's BOM otherwise downgrades the analyzer's BCEL dependency's
    // commons-lang3 and causes NoClassDefFoundError: org/apache/commons/lang3/Strings.
    // Scope this override to the analyzer; application dependencies stay unchanged.
    dependencyManagement {
        spotbugs {
            dependencies {
                dependency 'org.apache.commons:commons-lang3:3.21.0'
            }
        }
    }
    // Annotation-only dependency for the analyzer; never added to application
    // compile/runtime classpaths or the production artifact.
    configurations.create('spotbugsAuxiliary') {
        canBeConsumed = false
        transitive = false
    }
    dependencies {
        spotbugsAuxiliary 'org.checkerframework:checker-qual:3.37.0'
    }
    spotbugs {
        toolVersion = rootProject.spotbugsVersion
        effort = Effort.valueOf('MAX')
        reportLevel = Confidence.valueOf('LOW')
        ignoreFailures = false
        maxHeapSize = providers.gradleProperty('spotbugsMaxHeapSize').getOrElse('1g')
    }
    tasks.named('check') { dependsOn tasks.named('spotlessCheck') }
}
apply from: 'quality.gradle'

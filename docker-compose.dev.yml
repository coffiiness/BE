version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-calfit}
      - MYSQL_USER=${MYSQL_USER:-calfit}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-calfit123}
      - TZ=Asia/Seoul
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME:-local}/final-backend:dev
    container_name: backend-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - STORAGE_DATABASE_CORE_DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-calfit}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      - STORAGE_DATABASE_CORE_DB_USERNAME=${MYSQL_USER:-calfit}
      - STORAGE_DATABASE_CORE_DB_PASSWORD=${MYSQL_PASSWORD:-calfit123}
      - JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "8080:8080"
    networks:
      - dev-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
    networks:
      - dev-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_dev_data:/var/lib/grafana
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  mysql_dev_data:
  prometheus_dev_data:
  grafana_dev_data:
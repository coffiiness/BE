<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>워크스페이스 인증</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">

<h2 style="color: #12B582;">CalFit 워크스페이스 인증</h2>

<p>안녕하세요 <strong th:text="${userName}">사용자</strong>님,</p>
<p>
    CalFit에 가입해 주셔서 감사합니다.<br>
    아래 <strong>인증하기</strong> 버튼을 클릭하여 인증을 완료해 주세요.
</p>

<!-- 만료 시각 표시 -->
<p style="color: #e53935; font-size: 13px;">
    ⏰ 인증 링크는 <strong th:text="${expiresAt}">01시간</strong> 이내에 유효합니다.
</p>

<div style="text-align: center; margin: 30px 0;">
    <a th:href="${verificationLink}"
       style="background-color: #12B582; color: #ffffff; padding: 12px 24px;
              text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">
        인증하기
    </a>
</div>

<hr style="border: none; border-top: 1px solid #eee; margin-top: 30px;">
<p style="font-size: 12px; color: #999; text-align: center;">CalFit 팀 드림</p>

</body>
</html>

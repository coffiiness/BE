<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전형 결과 안내</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">

<!-- 합격 / 불합격에 따라 헤더 색상 분기 -->
<h2 th:style="${isAccepted} ? 'color: #12B582;' : 'color: #e53935;'"
    th:text="${isAccepted} ? '합격을 축하드립니다 🎉' : '전형 결과 안내'">
</h2>

<p>안녕하세요 <strong th:text="${applicantName}">지원자</strong>님,</p>

<!-- 합격 본문 -->
<div th:if="${isAccepted}">
    <p>
        <strong th:text="${companyName}">회사</strong>의
        <strong th:text="${positionName}">직무</strong> 전형에
        합격하셨음을 기쁜 마음으로 안내해 드립니다.
    </p>
    <p>자세한 다음 전형 일정은 추후 안내해 드리겠습니다.</p>
</div>

<!-- 불합격 본문 -->
<div th:unless="${isAccepted}">
    <p>
        <strong th:text="${companyName}">회사</strong>의
        <strong th:text="${positionName}">직무</strong> 전형에
        지원해 주셔서 감사합니다.
    </p>
    <p>
        아쉽게도 이번 전형에서는 함께하지 못하게 되었습니다.<br>
        뛰어난 역량에도 불구하고 제한된 인원으로 인해 부득이하게 이러한 결정을 내리게 된 점 양해 부탁드립니다.
    </p>
    <p>다음에 더 좋은 기회로 다시 모실 수 있기를 바랍니다.</p>
</div>

<hr style="border: none; border-top: 1px solid #eee; margin-top: 30px;">
<p style="font-size: 12px; color: #999; text-align: center;">
    <span th:text="${companyName}">Calfit 팀</span> 드림
</p>

</body>
</html>

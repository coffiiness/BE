<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>CalFit 전형 결과 안내</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f5f7fb; font-family: 'Segoe UI', Arial, sans-serif; color: #111827;">
    <div style="max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);">
      <div
        th:style="${isAccepted} ? 'padding: 32px; background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); color: #ffffff;' : 'padding: 32px; background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); color: #ffffff;'">
        <div style="font-size: 14px; letter-spacing: 0.08em; opacity: 0.82;" th:text="${companyName}">CalFit</div>
        <h1 style="margin: 12px 0 0; font-size: 28px; line-height: 1.3;" th:text="${headline}">전형 결과 안내</h1>
      </div>
      <div style="padding: 32px; line-height: 1.7;">
        <p style="margin-top: 0;"><strong th:text="${applicantName}">지원자</strong>님, 안녕하세요.</p>
        <p>
          <strong th:text="${positionName}">포지션</strong> 전형 결과를 안내드립니다.
        </p>
        <p th:text="${summary}">전형 결과가 준비되었습니다.</p>
        <div th:if="${highlightLabel != null and highlightValue != null}" style="margin-top: 24px; padding: 18px; border-radius: 16px; background: #f8fafc; border: 1px solid #dbeafe;">
          <div style="font-size: 13px; color: #475569;" th:text="${highlightLabel}">다음 전형</div>
          <div style="margin-top: 6px; font-size: 18px; font-weight: 700; color: #0f172a;" th:text="${highlightValue}">1차 면접</div>
        </div>
      </div>
    </div>
  </body>
</html>
